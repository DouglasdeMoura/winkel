name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install build dependencies
        run: |
          # The hosted runners' resolver has failed to resolve the Ubuntu
          # mirror; switch to public resolvers and retry the install.
          sudo sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 &&
              sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
                libxcb1-dev libxcb-xkb-dev libwayland-dev wayland-protocols libvulkan-dev \
                libfontconfig1-dev libfreetype6-dev clang &&
              exit 0
            sleep 15
          done
          exit 1
      - uses: actions/checkout@v4
      - name: Build the release tarball
        run: make dist ARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes

  aur:
    needs: release
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ github.ref_name }}
      dry_run: false
    secrets:
      AUR_KEY: ${{ secrets.AUR_KEY }}
