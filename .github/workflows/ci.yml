name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and libraries
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust alsa-lib libxkbcommon libxkbcommon-x11 libxcb vulkan-icd-loader vulkan-headers wayland wayland-protocols fontconfig freetype2 clang ripgrep ttf-jetbrains-mono-nerd
      - uses: actions/checkout@v4
      - name: Rust tests
        run: |
          cargo test --locked
          cargo test -p winkel-ui --features test-support --locked
