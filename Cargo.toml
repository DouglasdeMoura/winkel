[package]
name = "winkel"
version = "0.2.1"
edition = "2021"
description = "A metronome for Omarchy: Rust backend, GPUI frontend, follows the Omarchy theme"
rust-version = "1.89"
license = "MIT"
authors = ["Douglas Moura <doug@douglasmoura.com>"]
repository = "https://github.com/DouglasdeMoura/winkel"
homepage = "https://github.com/DouglasdeMoura/winkel"
readme = "README.md"
keywords = ["metronome", "omarchy", "gpui", "music", "audio"]
categories = ["multimedia::audio"]

[dependencies]
# The audio path stays std-only aside from cpal: a metronome is audio first,
# and cpal puts the click at an exact sample. The window path pulls in
# winkel-ui (gpui); --backend still speaks the same wire from this binary.
cpal = "0.15"
winkel-ui = { path = "ui-gpui" }

[profile.release]
opt-level = 3
lto = true
strip = true

# gpui's test-support pulls xattr 0.2.3, which references libc::ENOATTR — a
# constant modern libc no longer re-exports on Linux (it is ENODATA there).
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[workspace]
members = ["ui-gpui"]
